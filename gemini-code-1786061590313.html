<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PotatoFish Multi-User Room</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --btn-bg: #334155;
      --btn-hover: #475569;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .login-box {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .login-box h1 { color: var(--accent); font-size: 1.8rem; }
    .login-box input {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .login-box button {
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .error-msg { color: var(--danger); font-size: 0.85rem; display: none; }

    #room-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
    }

    #room-screen.active { display: flex; }

    .top-bar {
      height: 60px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 30;
    }

    .top-bar .title { font-weight: bold; color: var(--accent); font-size: 1rem; }
    .status-tag { font-size: 0.75rem; color: var(--muted); display: block; }

    .leave-room-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 10px;
    }

    .chat-panel {
      width: 100%;
      max-width: 600px;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title { font-weight: bold; color: var(--accent); font-size: 0.95rem; }

    .save-toggle-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569; transition: .3s; border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      background: #334155;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 85%;
      word-break: break-word;
      font-size: 0.9rem;
    }

    .message.self {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
    }

    .message .sender {
      font-size: 0.7rem;
      font-weight: bold;
      margin-bottom: 2px;
      opacity: 0.85;
    }

    .message a {
      color: #38bdf8;
      text-decoration: underline;
    }

    .message.self a {
      color: #0f172a;
    }

    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 20px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input-area button {
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: var(--accent);
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="login-screen" class="login-box">
    <h1>🥔 PotatoFish</h1>
    <p style="color: var(--muted); font-size: 0.85rem;">Enter a room code to join</p>
    
    <input type="text" id="room-code" placeholder="Room code (e.g. potatofish)">
    <input type="text" id="username" placeholder="Pick a username">
    <button onclick="joinRoom()">Enter Room</button>
    
    <p id="error-msg" class="error-msg"></p>
  </div>

  <div id="room-screen">
    <div class="top-bar">
      <div>
        <div class="title" id="room-title">🥔 Room</div>
        <span class="status-tag" id="conn-status">Connecting...</span>
      </div>
      <button class="leave-room-btn" onclick="leaveRoom()">Leave</button>
    </div>

    <div class="main-container">
      <div class="chat-panel" id="chat-panel">
        <div class="chat-header">
          <span class="chat-title">Chat</span>
          <div class="save-toggle-box">
            <span>Save</span>
            <label class="switch">
              <input type="checkbox" id="save-chat-toggle" onchange="toggleSaveChat()">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
          <div class="message">
            <div class="sender">System</div>
            Welcome! Share your room code with friends to connect. Links sent in chat will be clickable!
          </div>
        </div>

        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Message..." onkeypress="handleKeyPress(event)">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUsername = "";
    let roomCode = "";
    let peer = null;
    let connections = {};
    let peerUsernames = {};
    let savedMessages = [];

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    function joinRoom() {
      const codeInput = document.getElementById("room-code").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
      const usernameInput = document.getElementById("username").value.trim();
      const errorMsg = document.getElementById("error-msg");

      if (!codeInput || !usernameInput) {
        errorMsg.innerText = "Please fill in both fields.";
        errorMsg.style.display = "block";
        return;
      }

      roomCode = codeInput;
      currentUsername = usernameInput;

      document.getElementById("room-title").innerText = `🥔 ${roomCode.toUpperCase()}`;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("room-screen").classList.add("active");

      loadSavedChatState();
      initializePeer();
    }

    function initializePeer() {
      const hostId = `pf-fullmesh-${roomCode}-host`;

      peer = new Peer(hostId, peerConfig);

      peer.on('open', () => {
        updatePeerCount();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer = new Peer(peerConfig);
          peer.on('open', () => {
            connectToPeer(hostId);
          });
        } else {
          updateStatus("Error: " + err.type);
        }
      });

      peer.on('connection', (conn) => setupDataConnection(conn));
    }

    function connectToPeer(targetPeerId) {
      if (connections[targetPeerId] || targetPeerId === peer.id) return;
      const conn = peer.connect(targetPeerId, { reliable: true });
      setupDataConnection(conn);
    }

    function setupDataConnection(conn) {
      connections[conn.peer] = conn;

      conn.on('open', () => {
        conn.send({ type: 'handshake', username: currentUsername });
        updatePeerCount();

        if (peer.id && peer.id.endsWith('-host')) {
          const activePeers = Object.keys(connections).filter(id => id !== conn.peer);
          conn.send({ type: 'peer-list', peers: activePeers });

          activePeers.forEach(pId => {
            if (connections[pId] && connections[pId].open) {
              connections[pId].send({ type: 'new-peer', peerId: conn.peer });
            }
          });
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'handshake') {
          peerUsernames[conn.peer] = data.username;
          updatePeerCount();
        } 
        else if (data.type === 'peer-list') {
          data.peers.forEach(pId => connectToPeer(pId));
        }
        else if (data.type === 'new-peer') {
          connectToPeer(data.peerId);
        }
        else if (data.type === 'chat') {
          addChatMessage(data.sender, data.text, false, true);
        } 
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete peerUsernames[conn.peer];
        updatePeerCount();
      });

      conn.on('error', () => {
        delete connections[conn.peer];
        updatePeerCount();
      });
    }

    function updatePeerCount() {
      const total = Object.keys(connections).length + 1;
      updateStatus(`Connected (${total} in room)`);
    }

    function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;

      Object.values(connections).forEach(conn => {
        if (conn.open) {
          conn.send({ type: 'chat', sender: currentUsername, text: text });
        }
      });

      addChatMessage(currentUsername, text, true, true);
      input.value = "";
    }

    function addChatMessage(sender, text, isSelf, shouldStore = true) {
      const chatBox = document.getElementById("chat-messages");
      const msgDiv = document.createElement("div");
      msgDiv.className = isSelf ? "message self" : "message";
      
      const formattedText = parseLinks(escapeHtml(text));
      msgDiv.innerHTML = `<div class="sender">${escapeHtml(sender)}</div>${formattedText}`;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      if (shouldStore) saveMessageToStorage(sender, text);
    }

    function parseLinks(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    function loadSavedChatState() {
      const isEnabled = localStorage.getItem(`pf_save_${roomCode}`) === "true";
      document.getElementById("save-chat-toggle").checked = isEnabled;

      if (isEnabled) {
        const stored = localStorage.getItem(`pf_msgs_${roomCode}`);
        if (stored) {
          savedMessages = JSON.parse(stored);
          savedMessages.forEach(msg => addChatMessage(msg.sender, msg.text, msg.sender === currentUsername, false));
        }
      }
    }

    function toggleSaveChat() {
      const isEnabled = document.getElementById("save-chat-toggle").checked;
      localStorage.setItem(`pf_save_${roomCode}`, isEnabled);
      if (!isEnabled) {
        localStorage.removeItem(`pf_msgs_${roomCode}`);
        savedMessages = [];
      } else {
        localStorage.setItem(`pf_msgs_${roomCode}`, JSON.stringify(savedMessages));
      }
    }

    function saveMessageToStorage(sender, text) {
      if (document.getElementById("save-chat-toggle").checked) {
        savedMessages.push({ sender, text });
        localStorage.setItem(`pf_msgs_${roomCode}`, JSON.stringify(savedMessages));
      }
    }

    function handleKeyPress(e) { if (e.key === "Enter") sendMessage(); }
    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function updateStatus(text) { document.getElementById("conn-status").innerText = text; }

    function leaveRoom() {
      Object.values(connections).forEach(c => c.close());
      if (peer) peer.destroy();
      location.reload();
    }
  </script>
</body>
</html>
