<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoFish Room Sync</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: 1px solid #475569;
      font-size: 0.95rem;
    }

    input { background: #0f172a; color: #fff; outline: none; }

    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .btn-meet {
      background: var(--success);
      color: #fff;
      font-size: 1rem;
      margin-top: 12px;
    }

    #room-screen { display: none; }

    .chat-box {
      height: 180px;
      background: #0f172a;
      border-radius: 10px;
      overflow-y: auto;
      padding: 12px;
      text-align: left;
      margin: 12px 0;
      font-size: 0.85rem;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-msg { word-break: break-word; }
    .chat-msg b { color: var(--accent); }
    .status-badge { font-size: 0.75rem; color: var(--success); margin-bottom: 12px; display: block; }
  </style>
</head>
<body>

  <div class="card" id="login-screen">
    <h1>🥔 PotatoFish</h1>
    <p>Enter a room name to sync with your group</p>
    <input type="text" id="room-code" placeholder="Room Code (e.g. potatofish)">
    <input type="text" id="username" placeholder="Your Name">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <div class="card" id="room-screen">
    <h1 id="room-title">Room</h1>
    <span class="status-badge">● Live Synced Backend</span>

    <div style="text-align: left; margin-bottom: 12px;">
      <label style="font-size: 0.8rem; color: var(--muted);">Shared Google Meet Link:</label>
      <input type="text" id="meet-input" placeholder="Paste Meet link or code here..." oninput="updateSharedMeet()">
      <button class="btn-meet" onclick="openMeet()">📞 Join Google Meet</button>
    </div>

    <div class="chat-box" id="chat"></div>

    <div style="display: flex; gap: 6px;">
      <input type="text" id="msg-input" placeholder="Message room..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button style="width: 80px;" onclick="sendMsg()">Send</button>
    </div>
  </div>

  <script>
    // Configured with a free, public Firebase Realtime Database endpoint
    const firebaseConfig = {
      databaseURL: "https://potatofish-chat-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let roomCode = "";
    let username = "";
    let roomRef = null;

    function joinRoom() {
      const codeInput = document.getElementById('room-code').value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
      const userInput = document.getElementById('username').value.trim();

      if (!codeInput || !userInput) {
        alert("Please enter both a room code and a name.");
        return;
      }

      roomCode = codeInput;
      username = userInput;

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('room-screen').style.display = 'block';
      document.getElementById('room-title').innerText = "🥔 " + roomCode.toUpperCase();

      // Connect directly to the specific room in Firebase
      roomRef = db.ref('rooms/' + roomCode);

      // Listen for shared Google Meet link updates in real-time
      roomRef.child('meetCode').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val !== null) {
          document.getElementById('meet-input').value = val;
        }
      });

      // Listen for chat messages in real-time
      roomRef.child('messages').on('child_added', (snapshot) => {
        const data = snapshot.val();
        addChat(data.user, data.msg);
      });
    }

    // Broadcasts the Meet link to everyone in the room as you type
    function updateSharedMeet() {
      const link = document.getElementById('meet-input').value;
      if (roomRef) {
        roomRef.child('meetCode').set(link);
      }
    }

    // Broadcasts chat messages to the backend
    function sendMsg() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !roomRef) return;

      roomRef.child('messages').push({
        user: username,
        msg: text,
        timestamp: Date.now()
      });

      input.value = "";
    }

    function addChat(user, msg) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = "chat-msg";
      div.innerHTML = `<b>${escapeHtml(user)}:</b> ${escapeHtml(msg)}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function openMeet() {
      let code = document.getElementById('meet-input').value.trim();
      if (!code) {
        alert("No Google Meet link provided yet! Paste one in the field above.");
        return;
      }

      if (!code.startsWith("http")) {
        code = "https://meet.google.com/" + code;
      }
      window.open(code, '_blank');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
