<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoFish - Host Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --success: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 { color: var(--accent); font-size: 1.6rem; text-align: center; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 0.85rem; text-align: center; margin-bottom: 20px; }

    label { font-size: 0.85rem; font-weight: bold; color: var(--text); display: block; margin-top: 12px; margin-bottom: 4px; }
    
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border-radius: 10px;
      border: none;
      background: var(--success);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .status {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 14px;
      color: var(--muted);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👑 Host Control Panel</h1>
    <p>Publish a Google Meet link live to viewers</p>

    <label>1. Room Code</label>
    <input type="text" id="room-code" placeholder="e.g. potatofish">

    <label>2. Google Meet Code / Link</label>
    <input type="text" id="meet-link" placeholder="e.g. abc-defg-hij or full link">

    <button onclick="startHost()">🚀 Start Broadcast</button>

    <div class="status" id="status-text">Status: Not broadcasting</div>
  </div>

  <script>
    let peer = null;
    let connections = [];
    let currentLink = "";

    function startHost() {
      const roomInput = document.getElementById("room-code").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
      const linkInput = document.getElementById("meet-link").value.trim();
      const statusText = document.getElementById("status-text");

      if (!roomInput || !linkInput) {
        alert("Please enter both a room code and a Google Meet link!");
        return;
      }

      currentLink = linkInput;
      const hostPeerId = `pf-host-${roomInput}`;

      if (peer) peer.destroy();

      peer = new Peer(hostPeerId, {
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', () => {
        statusText.style.color = "#10b981";
        statusText.innerText = `● LIVE! Broadcasting on room "${roomInput.toUpperCase()}"`;
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          alert("This room code is already being hosted! Try a different room code.");
        } else {
          statusText.innerText = "Error: " + err.type;
        }
      });

      peer.on('connection', (conn) => {
        connections.push(conn);

        conn.on('open', () => {
          // Send current meeting link as soon as a viewer joins
          conn.send({ link: currentLink });
        });
      });
    }
  </script>
</body>
</html>
