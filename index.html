<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoFish - Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .brand-title { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .brand-title span { color: var(--accent); }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
    }

    .btn-join-room {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .message-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0 20px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      word-break: break-word;
    }

    .btn-meet {
      display: none;
      width: 100%;
      background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="brand-title">🥔 <span>PotatoFish</span></h1>

    <div id="join-section">
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Enter the host's room code to connect</p>
      <input type="text" id="room-code" placeholder="Room Code (e.g. potatofish)">
      <button class="btn-join-room" onclick="connectToHost()">Connect</button>
    </div>

    <div class="message-box" id="status-message">
      Enter a room code above to search for live meeting.
    </div>

    <a id="meet-btn" class="btn-meet" href="#" target="_blank" rel="noopener noreferrer">
      📞 Join Google Meet
    </a>
  </div>

  <script>
    let peer = null;

    function connectToHost() {
      const roomInput = document.getElementById("room-code").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
      const statusMessage = document.getElementById("status-message");
      const meetBtn = document.getElementById("meet-btn");

      if (!roomInput) return alert("Please enter a room code.");

      statusMessage.innerText = `Connecting to host room "${roomInput.toUpperCase()}"...`;

      if (peer) peer.destroy();

      peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });

      peer.on('open', () => {
        const hostPeerId = `pf-host-${roomInput}`;
        const conn = peer.connect(hostPeerId, { reliable: true });

        conn.on('open', () => {
          statusMessage.innerText = "Connected to host! Fetching Google Meet link...";
        });

        conn.on('data', (data) => {
          if (data && data.link) {
            let url = data.link.trim();
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
              url = "https://meet.google.com/" + url;
            }

            meetBtn.href = url;
            meetBtn.style.display = 'block';
            statusMessage.innerText = "🟢 Host is live! Click below to join the meeting.";
          }
        });

        conn.on('close', () => {
          statusMessage.innerText = "Host disconnected.";
          meetBtn.style.display = 'none';
        });
      });

      peer.on('error', () => {
        statusMessage.innerText = "❌ Host not found. Make sure the host has 'admin.html' open!";
        meetBtn.style.display = 'none';
      });
    }
  </script>
</body>
</html>
