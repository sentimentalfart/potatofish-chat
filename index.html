<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoFish Live Portal</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Top Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger-glow);
      color: var(--danger);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .status-badge.online {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--success-glow);
      color: var(--success);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      transition: background-color 0.3s ease;
    }

    .status-badge.online .pulse-dot {
      background-color: var(--success);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand-title span {
      background: linear-gradient(135deg, var(--accent) 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .message-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
      margin: 20px 0 24px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action {
      display: none;
      width: 100%;
      background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 10px 20px var(--success-glow);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(16, 185, 129, 0.35);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <div id="status-badge" class="status-badge">
        <span class="pulse-dot"></span>
        <span id="status-text">OFFLINE</span>
      </div>

      <h1 class="brand-title">🥔 <span>PotatoFish</span></h1>

      <div class="message-box" id="backend-message">
        Connecting to room host...
      </div>

      <a id="meet-btn" class="btn-action" href="#" target="_blank" rel="noopener noreferrer">
        📞 Join Meeting Now
      </a>

      <p class="footer-note">Live updates active • Powered by PotatoFish</p>

    </div>
  </div>

  <script>
    const BACKEND_URL = "http://localhost:5000/api/room";

    async function checkBackend() {
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const messageBox = document.getElementById('backend-message');
      const meetBtn = document.getElementById('meet-btn');

      try {
        const response = await fetch(BACKEND_URL);
        if (!response.ok) throw new Error("Offline");

        const data = await response.json();

        // Update Message
        messageBox.innerText = data.message || "Host is live!";

        // Update Button Link
        if (data.link && data.link.trim() !== "") {
          let url = data.link.trim();
          if (!url.startsWith("http://") && !url.startsWith("https://")) {
            url = "https://" + url;
          }
          meetBtn.href = url;
          meetBtn.style.display = 'inline-block';
        } else {
          meetBtn.style.display = 'none';
        }

        // Update Status to Online
        statusBadge.className = "status-badge online";
        statusText.innerText = "BROADCAST LIVE";

      } catch (err) {
        // Fallback state when Python script is closed
        messageBox.innerText = "Waiting for host to publish a link in Python...";
        meetBtn.style.display = 'none';

        statusBadge.className = "status-badge";
        statusText.innerText = "OFFLINE";
      }
    }

    // Auto-refresh every 2 seconds
    checkBackend();
    setInterval(checkBackend, 2000);
  </script>

</body>
</html>
